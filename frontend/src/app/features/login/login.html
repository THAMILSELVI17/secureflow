<div class="login-page">

  <div class="login-card">

    <div class="brand">
      <div class="logo">S</div>

      <div>
        <h1>SecureFlow</h1>
        <p>Role-Based Access Platform</p>
      </div>
    </div>

    <div class="login-header">
      <h2>Welcome back</h2>
      <p>Sign in to continue to SecureFlow</p>
    </div>

    @if (errorMessage) {
      <div class="error-message">
        {{ errorMessage }}
      </div>
    }

    <form (ngSubmit)="login()">

      <div class="form-group">
        <label for="userId">User ID</label>

        <input
          id="userId"
          type="text"
          name="userId"
          [(ngModel)]="userId"
          placeholder="Enter your User ID"
          autocomplete="username"
          [disabled]="loading"
        />
      </div>

      <div class="form-group">
        <label for="password">Password</label>

        <input
          id="password"
          type="password"
          name="password"
          [(ngModel)]="password"
          placeholder="Enter your password"
          autocomplete="current-password"
          [disabled]="loading"
        />
      </div>

      <div class="form-group">
        <label for="role">Role</label>

        <select
          id="role"
          name="role"
          [(ngModel)]="role"
          [disabled]="loading"
        >
          <option value="user">General User</option>
          <option value="admin">Admin</option>
        </select>
      </div>

      <button
        type="submit"
        class="login-button"
        [disabled]="loading"
      >
        @if (loading) {
          <span>Signing in...</span>
        } @else {
          <span>Sign In</span>
        }
      </button>

    </form>

    <div class="demo-info">

      <p class="demo-title">Demo Credentials</p>

      <div class="demo-row">
        <span>Admin</span>
        <span>admin001 / Admin@123</span>
      </div>

      <div class="demo-row">
        <span>User</span>
        <span>user001 / User@123</span>
      </div>

    </div>

    <p class="footer-text">
      Secure authentication powered by JWT
    </p>

  </div>

</div>
